<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selamat Ulang Tahun! 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bubblegum: #ff8fb8;
    --strawberry: #ffd1e3;
    --cream: #fff5f9;
    --berry: #d6336c;
    --cocoa: #5b2a3c;
    --shadow: #e8639a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Fredoka", ui-rounded, "Nunito", system-ui, sans-serif;
    color: var(--cocoa);
    background:
      radial-gradient(circle at 20% 15%, #ffe3ef 0 18%, transparent 19%),
      radial-gradient(circle at 85% 80%, #ffd1e3 0 22%, transparent 23%),
      var(--cream);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  .langit { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .langit span {
    position: absolute; bottom: -40px; opacity: .45;
    animation: naik linear infinite;
  }
  @keyframes naik {
    to { transform: translateY(-115vh) rotate(25deg); }
  }
  main {
    position: relative; z-index: 1;
    max-width: 520px; margin: 0 auto;
    padding: 36px 20px 56px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .hai {
    background: var(--bubblegum); color: #fff;
    padding: 6px 18px; border-radius: 999px;
    font-weight: 600; font-size: 1.05rem;
    box-shadow: 0 4px 0 var(--shadow);
    transform: rotate(-3deg);
  }
  h1 {
    margin-top: 18px;
    font-size: clamp(2.2rem, 9vw, 3.1rem);
    line-height: 1.1; font-weight: 700; color: var(--berry);
    text-shadow: 3px 3px 0 #ffc2da;
  }
  .cake { width: min(300px, 78vw); height: auto; margin-top: 10px; overflow: visible; }
  .cake .candle { cursor: pointer; }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: kedip .45s ease-in-out infinite alternate; transition: transform .35s, opacity .35s; }
  .flame:nth-of-type(2) { animation-delay: .15s; }
  .flame:nth-of-type(3) { animation-delay: .3s; }
  @keyframes kedip {
    from { transform: scale(1, 1) rotate(-4deg); }
    to   { transform: scale(.88, 1.1) rotate(4deg); }
  }
  .blown .flame { animation: none; transform: scale(0); opacity: 0; }
  .eyes-happy { display: none; }
  .blown .eyes-open { display: none; }
  .blown .eyes-happy { display: inline; }
  .cake-body { transform-box: fill-box; transform-origin: 50% 100%; animation: goyang 2.4s ease-in-out infinite; }
  @keyframes goyang { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  .petunjuk { margin-top: 8px; font-size: 1.05rem; }
  button.btn {
    margin-top: 16px;
    font: inherit; font-weight: 600; font-size: 1.15rem;
    color: #fff; background: var(--berry);
    border: 0; border-radius: 999px; padding: 14px 28px;
    box-shadow: 0 6px 0 #a3204f;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  button.btn:hover { transform: translateY(-2px); }
  button.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #a3204f; }
  button.btn:focus-visible { outline: 4px solid var(--cocoa); outline-offset: 4px; }
  .kartu {
    margin-top: 22px; width: 100%;
    background: #fff; border: 4px solid var(--bubblegum);
    border-radius: 28px; padding: 26px 22px 24px;
    box-shadow: 0 8px 0 var(--strawberry);
    position: relative;
  }
  .kartu[hidden] { display: none; }
  .kartu::before {
    content: "💌"; position: absolute; top: -26px; left: 50%;
    transform: translateX(-50%); font-size: 2.2rem;
    background: var(--cream); border-radius: 50%; padding: 0 6px;
  }
  .kartu.muncul { animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.6) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
  #pesan { font-size: 1.08rem; line-height: 1.7; text-align: left; max-width: 44ch; margin: 0 auto; white-space: pre-line; }
  .kartu { scroll-margin-top: 36px; }
  .tanda { margin-top: 10px; font-weight: 600; color: var(--berry); font-size: 1.1rem; }
  .konfeti { position: fixed; top: -40px; z-index: 5; pointer-events: none; }
  .peluk-hati { position: fixed; z-index: 5; pointer-events: none; font-size: 1.6rem; }
  .cake { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .cake:focus-visible { outline: 4px solid var(--cocoa); outline-offset: 6px; border-radius: 24px; }
  .flame { filter: drop-shadow(0 0 5px #ffb84d); }
  .petunjuk.denyut { animation: denyut 1.4s ease-in-out infinite; font-weight: 600; color: var(--berry); }
  @keyframes denyut { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .kenangan { margin-top: 34px; width: 100%; display: flex; flex-direction: column; align-items: center; }
  .kenangan[hidden] { display: none; }
  .kenangan.muncul { animation: pop .6s cubic-bezier(.3,1.6,.5,1); }
  .kenangan h2 { font-size: 1.7rem; color: var(--berry); text-shadow: 2px 2px 0 #ffc2da; }
  .album { margin-top: 22px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 30px; }
  .polaroid {
    width: min(100%, 420px); background: #fff;
    border: 4px solid var(--bubblegum); border-radius: 18px;
    padding: 10px 10px 12px; box-shadow: 0 7px 0 var(--strawberry);
    transform: rotate(var(--r, 0deg));
  }
  .polaroid.tinggi { width: min(100%, 290px); }
  .polaroid img { display: block; width: 100%; height: auto; border-radius: 10px; }
  .polaroid figcaption { margin-top: 10px; font-weight: 600; color: var(--berry); font-size: 1.1rem; }
  .penutup { margin-top: 30px; font-size: 1.25rem; font-weight: 600; color: var(--berry); max-width: 26ch; }
  @media (prefers-reduced-motion: reduce) {
    .flame, .cake-body, .langit span, .kartu.muncul, .kenangan.muncul, .petunjuk.denyut { animation: none; }
  }
</style>
</head>

  </svg>

  <p class="petunjuk denyut" id="petunjuk">Ketuk lilinnya untuk meniup, terus buat permintaan 🤫</p>

<script>
  // ====== UBAH BAGIAN INI ======
  const NAMA = "Ashilah Shafa Gutama";            // ganti dengan namanya, contoh: "Putri"
  const DARI = "Yudi"; // ganti dengan namamu
  const PESAN = [
    "Happy birthday ya, sayang! 🎉✨",
    "Selamat bertambah umur buat manusia terfavorit aku. Jujur dari kemarin aku mikir mau nulis apa biar nggak kelihatan lebay, tapi yang jelas aku cuma mau bilang makasih banyak udah hadir dan bikin hari-hari aku jadi jauh lebih berwarna.",
    "Makasih udah selalu sabar menghadapi aku, udah jadi tempat cerita paling nyaman, dan selalu bisa bikin aku senyum pas lagi capek atau berantakan banget. Kamu tuh beneran definisi safe place buat aku. Makin ke sini aku makin sadar kalau hal-hal kecil dari cara kamu ketawa, obrolan random kita pas malam, sampai perhatian-perhatian kecil kamu itu selalu sukses bikin aku ngerasa beruntung banget bisa punya kamu.",
    "Di umur kamu yang baru ini, aku berdoa semoga kamu selalu sehat, makin bahagia, dan semua hal yang lagi kamu perjuangin bisa tercapai satu per satu. Jangan pernah ragu sama diri kamu sendiri ya, soalnya kamu tuh keren banget dan aku bakal selalu ada di belakang kamu buat dukung kamu dalam kondisi apa pun.",
    "Semoga hari ini dan hari-hari ke depannya selalu penuh sama hal-hal baik. I’m so proud of you, and I love you more than you know. Selamat ulang tahun ya, dunianya aku! ❤️🥳❤️🥳"
  ].join("\n\n");
  // =============================

  const kurangGerak = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);

  $("hai").textContent = "Hai, " + NAMA + "!";
  $("judul").textContent = "Selamat Ulang Tahun, " + NAMA + "!";
  $("tanda").textContent = "Dari: " + DARI + " 💕";

  // hati melayang di latar
  const langit = $("langit");
  const hiasan = ["💗", "🌸", "🎀", "🍓", "✨"];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span");
    s.textContent = hiasan[i % hiasan.length];
    s.style.left = rand(2, 96) + "%";
    s.style.fontSize = rand(16, 32) + "px";
    s.style.animationDuration = rand(14, 26) + "s";
    s.style.animationDelay = "-" + rand(0, 20) + "s";
    langit.appendChild(s);
  }

  // hujan konfeti
  function hujan(jumlah) {
    if (kurangGerak) return;
    const isi = ["💗", "🌸", "⭐", "🎀", "✨", "🍓"];
    for (let i = 0; i < jumlah; i++) {
      const el = document.createElement("span");
      el.className = "konfeti";
      el.textContent = isi[Math.floor(rand(0, isi.length))];
      el.style.left = rand(0, 96) + "vw";
      el.style.fontSize = rand(18, 36) + "px";
      document.body.appendChild(el);
      el.animate(
        [
          { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
          { transform: "translate(" + rand(-90, 90) + "px," + (innerHeight + 80) + "px) rotate(" + rand(-360, 360) + "deg)", opacity: 1 }
        ],
        { duration: rand(2400, 4800), delay: rand(0, 900), easing: "cubic-bezier(.3,.6,.5,1)", fill: "forwards" }
      ).onfinish = () => el.remove();
    }
  }

  // ketik pesan
  function ketik(teks, tujuan, selesai) {
    if (kurangGerak) { tujuan.textContent = teks; selesai(); return; }
    // cadangkan tinggi supaya kartu tidak melompat saat teks diketik
    tujuan.textContent = teks;
    tujuan.style.minHeight = tujuan.offsetHeight + "px";
    tujuan.textContent = "";
    const huruf = Array.from(teks);
    let i = 0;
    const t = setInterval(() => {
      tujuan.textContent = huruf.slice(0, ++i).join("");
      if (i >= huruf.length) { clearInterval(t); setTimeout(selesai, 700); }
    }, 22);
  }

  function tampilkanFoto() {
    const k = $("kenangan");
    k.hidden = false;
    k.classList.add("muncul");
    k.scrollIntoView({ behavior: kurangGerak ? "auto" : "smooth", block: "start" });
  }

  let sudahTiup = false;
  function tiup() {
    if (sudahTiup) return;
    sudahTiup = true;
    $("kue").classList.add("blown");
    $("kue").style.cursor = "default";
    $("petunjuk").classList.remove("denyut");
    $("petunjuk").textContent = "Yeay! Semoga permintaanmu terkabul 🎉";
    hujan(50);
    // api padam dulu, baru teks muncul
    setTimeout(() => {
      const kartu = $("kartu");
      kartu.hidden = false;
      kartu.classList.add("muncul");
      kartu.scrollIntoView({ behavior: kurangGerak ? "auto" : "smooth", block: "start" });
      ketik(PESAN, $("pesan"), tampilkanFoto);
    }, kurangGerak ? 0 : 900);
  }

  const kue = $("kue");
  kue.addEventListener("click", tiup);
  kue.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tiup(); }
  });

  // peluk: hati naik dari tombol
  $("peluk").addEventListener("click", (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    for (let i = 0; i < 8; i++) {
      const h = document.createElement("span");
      h.className = "peluk-hati";
      h.textContent = ["💗", "💖", "🤗", "💞"][i % 4];
      h.style.left = r.left + r.width / 2 + rand(-40, 40) + "px";
      h.style.top = r.top + "px";
      document.body.appendChild(h);
      if (kurangGerak) { setTimeout(() => h.remove(), 1200); continue; }
      h.animate(
        [{ transform: "translateY(0) scale(.6)", opacity: 1 }, { transform: "translateY(" + rand(-220, -120) + "px) scale(1.3)", opacity: 0 }],
        { duration: rand(1000, 1700), delay: i * 70, easing: "ease-out", fill: "forwards" }
      ).onfinish = () => h.remove();
    }
  });
</script>
</body>
</html>
